name: Build, Sign & Attest Container Image

on:
  push:
    branches: [main]
    tags: ['v*']  # Trigger khi push tag v1.0.0, v2.1.0, ...

env:
  REGISTRY: registry.awsfcaj.com
  IMAGE_NAME: wineapp/wineapp-frontend

permissions:
  contents: read
  packages: write       # Quyền push Image lên Private Registry
  id-token: write       # Quyền lấy OIDC token cho Cosign Keyless
  attestations: write   # Quyền tạo attestation

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest

    steps:
      # ============================
      # BƯỚC 1: CHUẨN BỊ
      # ============================
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft (SBOM Generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Install Trivy (Vulnerability Scanner)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          # Chỉ cài đặt, chưa quét
          exit-code: '0'

      # ============================
      # BƯỚC 2: BUILD & PUSH IMAGE
      # ============================
      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ============================
      # BƯỚC 3: KÝ SỐ IMAGE (COSIGN KEYLESS)
      # ============================
      - name: Sign the container image
        run: |
          # Cosign Keyless: Tự động lấy OIDC token từ GitHub Actions
          # Không cần private key, chữ ký được ghi lên Rekor transparency log
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # ============================
      # BƯỚC 4: TẠO & ĐÍNH KÈM SBOM
      # ============================
      - name: Generate SBOM (CycloneDX format)
        run: |
          syft \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json \
            > sbom-cyclonedx.json

      - name: Attest SBOM to image
        run: |
          # Đính kèm SBOM vào image dưới dạng Cosign attestation
          cosign attest --yes \
            --predicate sbom-cyclonedx.json \
            --type sbom/cyclone-dx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # ============================
      # BƯỚC 5: QUÉT LỖ HỔNG & ĐÍNH KÈM KẾT QUẢ
      # ============================
      - name: Scan for vulnerabilities
        run: |
          trivy image \
            --format cosign-vuln \
            --output vuln-report.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest vulnerability scan to image
        run: |
          cosign attest --yes \
            --predicate vuln-report.json \
            --type cosign.sigstore.dev/attestation/vuln/v1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # ============================
      # BƯỚC 6: XÁC MINH (TỰ KIỂM TRA)
      # ============================
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Print summary
        run: |
          echo "✅ Image built:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          echo "✅ Signature:    Cosign Keyless (GitHub Actions OIDC)"
          echo "✅ SBOM:         CycloneDX format attached"
          echo "✅ Vuln Scan:    Trivy scan results attached"
          echo ""
          echo "This image is now ready for Kyverno ImageValidatingPolicy verification!"